name: Warden VS Code Extension Hunt
on:
  # Weekly (Mondays 07:43 UTC), and on demand. Screens Open VSX and VS Marketplace
  # metadata, then fetches and statically analyzes the top candidates inside
  # the Tier-2 sandbox container. Confirmed extensions are previewed for OSM
  # (exact report bodies in the run summary); the `submit` job sends only what
  # a reviewer approves on the protected osm-submission environment.
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to hunt
        required: false
        default: all
        type: choice
        options: [all, openvsx, marketplace]
      limit:
        description: Max extensions to fetch and scan per registry
        required: false
        default: "15"
      recent:
        description: Recently published/updated extensions to screen per registry
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shares the hunt's group: never overlaps a hunt (same data cache).
    concurrency:
      group: git-warden-run
      cancel-in-progress: false
    outputs:
      validated: ${{ steps.osm_preview.outputs.validated }}
    steps:
      # Credentials are persisted on purpose: the evidence step commits and
      # pushes evidence/ back to the branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_TOKEN }} # zizmor: ignore[artipacked]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .

      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:latest .

      # Same cache the hunt writes: OSM-reported extension publishers (from
      # ingest) seed the screen, and extension verdicts persist between runs.
      - name: Restore data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}
          restore-keys: git-warden-data-

      - name: Hunt extensions
        env:
          GW_SHARED_INTEL: data/shared_intel/breadcrumbs.jsonl
          # Scheduled runs have no inputs; fall back to the dispatch defaults.
          REGISTRY: ${{ inputs.registry || 'all' }}
          LIMIT: ${{ inputs.limit || '15' }}
          RECENT: ${{ inputs.recent || '100' }}
        run: >-
          python gw.py extensions --registry "$REGISTRY" --limit "$LIMIT" --recent "$RECENT"
          --summary-md ext_summary.md

      # Read-only: checks OSM and writes the exact report bodies to the summary.
      # Nothing is POSTed here.
      - name: OSM submission preview
        id: osm_preview
        env:
          GW_SHARED_INTEL: data/shared_intel/breadcrumbs.jsonl
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
        run: |
          python -m git_warden.extensions.osm --dry-run \
            --evidence-dir evidence \
            --validated-json ext-osm-validated.json \
            --preview-json ext-osm-preview.json || true
          if [ -f ext-osm-validated.json ]; then
            echo "validated=$(cat ext-osm-validated.json)" >> "$GITHUB_OUTPUT"
          else
            echo "validated=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload OSM preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-osm-preview
          path: |
            ext-osm-validated.json
            ext-osm-preview.json
          if-no-files-found: ignore

      # The extension findings, their evidence and the OSM preview bodies go
      # into the committed evidence/ store with every other finding.
      - name: Publish evidence
        if: always()
        run: >-
          scripts/publish_evidence.sh "Auto-update evidence (extension hunt)"
          "python gw.py evidence"

      - name: Save data
        if: always() && hashFiles('data/*.sqlite') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}

      - name: Publish run summary
        if: always()
        run: |
          if [ -f ext_summary.md ]; then
            cat ext_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-hunt-summary
          path: ext_summary.md
          if-no-files-found: ignore

  # OSM write phase for extensions. Runs under the same protected
  # osm-submission environment as the repository submitter: a required
  # reviewer approves AFTER reading the preview in the hunt job's summary,
  # and the approved extensions then go to OSM. The submitter re-fetches,
  # re-scans and re-checks OSM for each one before every POST, so approval
  # never bypasses a safety gate.
  submit:
    needs: hunt
    if: >-
      ${{ needs.hunt.outputs.validated != ''
      && needs.hunt.outputs.validated != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: osm-submission
    concurrency:
      group: git-warden-ext-osm-submit
      cancel-in-progress: false
    steps:
      # Credentials are persisted on purpose: the submission record is
      # committed to evidence/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_TOKEN }} # zizmor: ignore[artipacked]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .

      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:latest .

      - name: Restore this run's hunt data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}
          fail-on-cache-miss: true

      # The exact list the reviewer saw in the preview; every key is re-checked
      # against a strict pattern by the submitter.
      - name: Write approved list
        env:
          VALIDATED: ${{ needs.hunt.outputs.validated }}
        run: printf '%s\n' "$VALIDATED" > ext-osm-validated.json

      - name: Submit approved extensions to OSM
        env:
          GW_SHARED_INTEL: data/shared_intel/breadcrumbs.jsonl
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
        run: >-
          python -m git_warden.extensions.osm
          --only-file ext-osm-validated.json
          --evidence-dir evidence

      # Commit the ledger and the updated osm_status column so the extension
      # is never offered again.
      - name: Publish evidence
        if: always()
        run: >-
          scripts/publish_evidence.sh "Record extension OSM submissions"
          "python gw.py evidence"
