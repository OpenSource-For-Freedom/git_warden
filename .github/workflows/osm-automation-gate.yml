name: OSM Automation Gate

on:
  # Manual only: run it from the Actions tab (Run workflow). No push, PR or schedule triggers.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-automation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate OSM automation policy
        run: python -m git_warden.osm_automation --check-config
      - name: Run OSM automation regression tests
        run: python -m pytest -q tests/test_osm_automation.py
      - name: Lint OSM automation surface
        run: python -m ruff check src/git_warden/osm_automation.py tests/test_osm_automation.py
      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:ci .
