name: OSM Automation Gate

on:
  push:
    branches: ['**']
    paths:
      - 'src/git_warden/osm_automation.py'
      - 'src/git_warden/config.py'
      - 'config/osm_automation.json'
      - 'tests/test_osm_automation.py'
      - '.github/workflows/osm-automation-gate.yml'
  pull_request:
    paths:
      - 'src/git_warden/osm_automation.py'
      - 'src/git_warden/config.py'
      - 'config/osm_automation.json'
      - 'tests/test_osm_automation.py'
      - '.github/workflows/osm-automation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-automation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate OSM automation policy
        run: python -m git_warden.osm_automation --check-config
      - name: Diagnose OSM bearer token on query-latest
        if: github.event_name != 'pull_request'
        env:
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
        run: python gw.py probe --feed osm --ecosystem repositories --limit 1

      - name: Live OSM API contract smoke test
        if: github.event_name != 'pull_request'
        env:
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
        run: python -m git_warden.osm_automation --check-api
      - name: Run OSM automation regression tests
        run: python -m pytest -q tests/test_osm_automation.py
      - name: Lint OSM automation surface
        run: python -m ruff check src/git_warden/osm_automation.py tests/test_osm_automation.py
      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:ci .
