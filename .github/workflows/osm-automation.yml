name: Warden OSM Automation
on:
  # Validate daily; anything that passes every gate waits for a human to approve
  # the `osm-submission` environment before a single report is sent to OSM.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs every gate but never claims or POSTs. Each repo that passes is written
  # to the run summary as "Validated malicious repo" (not yet reported to OSM).
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shares the hunt's group: never overlaps a hunt (same data cache).
    concurrency:
      group: git-warden-run
      cancel-in-progress: false
    outputs:
      count: ${{ steps.result.outputs.count }}
      repos: ${{ steps.result.outputs.repos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .

      - name: Validate OSM automation policy
        run: python -m git_warden.osm_automation --check-config

      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:latest .

      # Same cache the hunt (run.yml) writes: the confirmed findings to validate,
      # plus the submitted_osm marks and cooldowns this workflow records.
      - name: Restore data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}
          restore-keys: git-warden-data-

      - name: Validate against OSM (no submission)
        env:
          GW_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
          GW_SHARED_INTEL: data/shared_intel/breadcrumbs.jsonl
        run: >-
          python -m git_warden.osm_automation --dry-run
          --summary-md osm_summary.md --validated-json validated.json

      # The exact list a reviewer approves; the submit job may send nothing else.
      - name: Record validated repos
        id: result
        run: |
          echo "count=$(jq length validated.json)" >> "$GITHUB_OUTPUT"
          echo "repos=$(jq -c . validated.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq length validated.json)" -gt 0 ]; then
            {
              echo ""
              echo "> **Awaiting approval:** approve the \`osm-submission\` deployment on this"
              echo "> run to submit the $(jq length validated.json) repo(s) above to OSM."
              echo "> Each is re-validated immediately before it is sent."
            } >> osm_summary.md
          fi

      # Saved even when the run fails, so cooldowns are never lost.
      - name: Save data
        if: always() && hashFiles('data/*.sqlite') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}

      - name: Publish run summary
        if: always()
        run: |
          if [ -f osm_summary.md ]; then
            cat osm_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-validation-summary
          path: osm_summary.md
          if-no-files-found: ignore

  # Only runs once a reviewer approves the `osm-submission` environment, and only
  # for the repos the validate job listed. Each is re-validated (sandbox, liveness,
  # two OSM full-history checks) right before its POST, so a repo taken down or
  # reported by someone else while the approval was pending is dropped.
  submit:
    needs: validate
    if: needs.validate.outputs.count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: osm-submission
    # Its own group so a pending approval never blocks hunts or validation runs.
    concurrency:
      group: osm-submit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .

      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:latest .

      - name: Restore data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}-submit
          restore-keys: git-warden-data-

      - name: Submit approved repos to OSM
        env:
          GW_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
          GW_SHARED_INTEL: data/shared_intel/breadcrumbs.jsonl
          APPROVED: ${{ needs.validate.outputs.repos }}
        run: |
          printf '%s' "$APPROVED" > approved.json
          python -m git_warden.osm_automation --only-file approved.json \
            --summary-md osm_summary.md

      # Saved even when a POST failed, so submitted marks are never lost.
      - name: Save data
        if: always() && hashFiles('data/*.sqlite') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}-submit

      - name: Publish run summary
        if: always()
        run: |
          if [ -f osm_summary.md ]; then
            cat osm_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-submission-summary
          path: osm_summary.md
          if-no-files-found: ignore
