name: The Warden
on:
  # On-demand ONLY -- no automatic schedule. Trigger via "Run workflow" in the
  # Actions tab when you want a fresh scan, or run it locally:
  #   gw ingest && gw hunt --scan --gold        (uses a local data/git_warden.sqlite)
  # The DB for these dispatch runs persists in the Actions cache between runs
  # (best-effort: GitHub evicts a cache after ~7 idle days).
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates to Tier-2 scan this run"
        type: number
        default: 75
      timeout_minutes:
        description: "Hunt job timeout in minutes (GitHub-hosted cap is 360)"
        type: number
        default: 60
      max_signatures:
        description: "Malware code-signature searches this run"
        type: number
        default: 14
      resume:
        description: "Skip repos already Tier-2 scanned (continue a long sweep)"
        type: boolean
        default: false
      signature_family:
        description: "Search this signature family first (e.g. minecraft); blank for none"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: git-warden-run
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/legion_runner@v1.0.61
        with:
          egress-policy: audit
      # Credentials are persisted on purpose: the "Publish registry table to
      # README" step below commits and pushes back to the default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_TOKEN }} # zizmor: ignore[artipacked]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . semgrep guarddog

      # Tier-2 clones and scans every candidate inside this container (GW_SANDBOX
      # defaults on). Without the image every scan fails and the hunt confirms
      # nothing.
      - name: Build Tier-2 sandbox
        run: docker build -f docker/Dockerfile.sandbox -t warden-sandbox:latest .

      - name: Restore data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: git-warden-data-${{ github.run_id }}
          restore-keys: git-warden-data-

      - name: Reconcile registry (self-heal before publishing)
        # Always runs: drops confirmed findings with no static evidence, evidence
        # only in security-data files (a scanner's own rule set / advisory cache),
        # or under a known-good org. Keeps the wall evidence-only every run.
        run: python gw.py review --reconcile

      - name: Ingest threat-intel breadcrumbs
        env:
          GW_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
        run: python gw.py ingest

      - name: Hunt malicious repositories (Tier-2 + gold)
        env:
          GW_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GW_OSM_API_KEY: ${{ secrets.OSM_KEY }}
          GW_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HUNT_LIMIT: ${{ inputs.limit }}
          HUNT_MAX_SIGNATURES: ${{ inputs.max_signatures }}
          HUNT_RESUME: ${{ inputs.resume && '--resume' || '' }}
          HUNT_SIGNATURE_FAMILY: ${{ inputs.signature_family }}

        # Top N candidates per run (ranked by signature/owner/signal priority),
        # not every possible repo. Discovery skips repos already in the DB, so
        # back-to-back long runs each surface the next batch of new finds.
        run: >-
          python gw.py hunt --scan --gold --limit "$HUNT_LIMIT"
          --max-signatures "$HUNT_MAX_SIGNATURES" $HUNT_RESUME
          --signature-family "$HUNT_SIGNATURE_FAMILY"

      - name: Publish registry table to README
        if: always()
        run: |
          git config user.name "git-warden[bot]"
          git config user.email "git-warden@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README registry unchanged; nothing to push."
            exit 0
          fi
          git add README.md
          git commit -m "Auto-update malicious-repo registry table [skip ci]"
          # The hunt step runs ~45 min, so main may have advanced since checkout
          # (or this is a re-run pinned to an older SHA). Rebase our commit onto
          # the live tip FIRST and only push if the rebase is clean; loop to
          # absorb a push that races with another update.
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase --autostash "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort 2>/dev/null || true
              echo "::error::README registry rebase conflicted with origin/${GITHUB_REF_NAME}; manual merge needed."
              exit 1
            fi
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Registry update pushed (attempt ${attempt})."
              pushed=true
              break
            fi
            echo "Push raced with another update; refetching and rebasing (attempt ${attempt})."
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push README registry update after 5 attempts."
            exit 1
          fi

      - name: Upload run artifacts (full transparency)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-warden-artifacts
          path: artifacts/
          if-no-files-found: ignore
